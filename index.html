<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core-X: 命運休息協議</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 強制覆蓋與新增樣式 */
        .setting-item.break-setting { display: none !important; }
        .mode-gamble { background: #121212 !important; color: white !important; }
        .hidden-lock { display: none !important; }
        .gold-btn {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 24px;
            padding: 15px 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            margin-top: 20px;
            width: 100%;
            font-size: 1.1em;
        }
        #gamble-zone { text-align: center; padding: 40px 20px; }
        .multiplier-card {
            margin: 20px 0;
            padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .game-switch button {
            margin: 5px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body class="theme-focus">
    <main class="app-shell">
        <section id="timerPanel" class="timer-panel card">
            <h1 id="status-badge">系統專注中</h1>
            <div class="ring-wrapper">
                <svg class="progress-ring" width="320" height="320">
                    <circle class="ring-bg" cx="160" cy="160" r="130"></circle>
                    <circle id="progress-bar" class="ring-progress" cx="160" cy="160" r="130"></circle>
                </svg>
                <div class="time-display">
                    <span id="modeLabel">專注模式</span>
                    <strong id="timeText">25:00</strong>
                </div>
            </div>

            <div id="controls" class="stats-actions">
                <div class="setting-item">
                    <label>專注時長 (分鐘)</label>
                    <input type="range" id="focus-slider" min="1" max="60" value="25">
                    <span id="focus-val">25</span>
                </div>
                <button id="start-btn" class="cta-btn">啟動協議</button>
            </div>
        </section>

        <section id="gamble-zone" class="card hidden-lock">
            <h2>命運之戰</h2>
            <p>專注已完成！請贏取你的休息時間</p>
            
            <div class="multiplier-card">
                <p>基礎時間：5 分鐘</p>
                <div style="font-size: 2em; color: #FFD700; margin: 10px 0;">
                    <span id="current-multiplier">1.00</span>x
                </div>
                <p>最終休息：<span id="predicted-break" style="color: #00FF88;">5:00</span></p>
            </div>
            
            <div class="game-switch">
                <button id="playMinesBtn">掃雷 Mines</button>
                <button id="playPlinkoBtn">墜落 Plinko</button>
            </div>

            <div id="game-mount" style="margin-top:20px; min-height: 120px; border: 1px dashed rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                <p id="game-hint" style="color: #888;">選擇遊戲開始...</p>
            </div>
            
            <button id="cashout-btn" class="gold-btn hidden-lock">兌現並開始休息</button>
        </section>
    </main>
    <script src="app_v4.js"></script>
</body>
</html>
